name: Build and smoke test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Also run by upstream-bump.yaml: PRs opened with GITHUB_TOKEN do not trigger pull_request runs.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""
      publish:
        description: Push the images to ghcr.io
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  contract:
    # continentept-mcp contract: recorded fixtures + tools/list of the pinned package over stdio.
    # Never signs in to Continente; uses an empty data directory.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: cesto/server
        run: npm ci
      - name: Install the pinned continentept-mcp (no install scripts, no browser)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          version=$(sed -nE 's/^ARG CONTINENTEPT_MCP_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cesto/Dockerfile)
          test -n "$version"
          npm install -g --ignore-scripts "continentept-mcp@${version}"
      - name: Contract tests (fixtures, adapters, allowlist)
        working-directory: cesto/server
        run: npx vitest run test/contract
      - name: Live schema check (tools/list over stdio)
        working-directory: cesto/server
        run: |
          set -o pipefail
          npm run -s contract:check | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Read add-on version
        id: meta
        run: |
          version=$(grep -E '^version:' cesto/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build image (runs unit tests in the build)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: cesto
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
          tags: |
            cesto:test
            ghcr.io/jpch/${{ matrix.arch }}-cesto:${{ steps.meta.outputs.version }}
            ghcr.io/jpch/${{ matrix.arch }}-cesto:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/jpch/cesto-ha
          load: true
      - name: Image size
        run: |
          docker image inspect cesto:test --format '{{.Architecture}} {{.Size}}' | tee size.txt
      - name: Headless smoke test (search_products, read-only)
        run: |
          docker run -d --name smoke --platform ${{ matrix.platform }} \
            -e CONTINENTE_DATA_DIR=/tmp/continente --entrypoint sleep cesto:test infinity
          docker exec smoke uname -m
          docker exec smoke node --version
          docker exec -w /opt/smoke smoke node smoke.mjs
          echo "memory.peak bytes:"; docker exec smoke cat /sys/fs/cgroup/memory.peak
      - name: Publish to ghcr.io (main and tags, or when called with publish)
        if: github.event_name == 'push' || inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jpch/${{ matrix.arch }}-cesto:${{ steps.meta.outputs.version }}
          docker push ghcr.io/jpch/${{ matrix.arch }}-cesto:latest
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo "- image: $(cat size.txt 2>/dev/null)"
            echo "- memory.peak: $(docker exec smoke cat /sys/fs/cgroup/memory.peak 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"
