name: Build and smoke test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Read add-on version
        id: meta
        run: |
          version=$(grep -E '^version:' cesto/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build image (runs unit tests in the build)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: cesto
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
          tags: |
            cesto:test
            ghcr.io/jpch/${{ matrix.arch }}-cesto:${{ steps.meta.outputs.version }}
            ghcr.io/jpch/${{ matrix.arch }}-cesto:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/jpch/cesto-ha
          load: true
      - name: Image size
        run: |
          docker image inspect cesto:test --format '{{.Architecture}} {{.Size}}' | tee size.txt
      - name: Headless smoke test (search_products, read-only)
        run: |
          docker run -d --name smoke --platform ${{ matrix.platform }} \
            -e CONTINENTE_DATA_DIR=/tmp/continente --entrypoint sleep cesto:test infinity
          docker exec smoke uname -m
          docker exec smoke node --version
          docker exec -w /opt/smoke smoke node smoke.mjs
          echo "memory.peak bytes:"; docker exec smoke cat /sys/fs/cgroup/memory.peak
      - name: Publish to ghcr.io (main and tags only)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jpch/${{ matrix.arch }}-cesto:${{ steps.meta.outputs.version }}
          docker push ghcr.io/jpch/${{ matrix.arch }}-cesto:latest
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo "- image: $(cat size.txt 2>/dev/null)"
            echo "- memory.peak: $(docker exec smoke cat /sys/fs/cgroup/memory.peak 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"
