name: Build and smoke test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read add-on version
        id: meta
        run: echo "version=$(sed -n 's/^version: *\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p' continente_mcp/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build image (runs unit tests in the build)
        uses: docker/build-push-action@v6
        with:
          context: continente_mcp
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
          tags: |
            continente-mcp:test
            ghcr.io/jpch/${{ matrix.arch }}-continente-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/jpch/${{ matrix.arch }}-continente-mcp:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/jpch/continente-mcp-ha
          load: true
      - name: Image size
        run: |
          docker image inspect continente-mcp:test --format '{{.Architecture}} {{.Size}}' | tee size.txt
      - name: Headless smoke test (search_products, read-only)
        run: |
          docker run -d --name smoke --platform ${{ matrix.platform }} \
            -e CONTINENTE_DATA_DIR=/tmp/continente --entrypoint sleep continente-mcp:test infinity
          docker exec smoke uname -m
          docker exec smoke node --version
          docker exec -w /opt/smoke smoke node smoke.mjs
          echo "memory.peak bytes:"; docker exec smoke cat /sys/fs/cgroup/memory.peak
      - name: Publish to ghcr.io (main and tags only)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/jpch/${{ matrix.arch }}-continente-mcp:${{ steps.meta.outputs.version }}
          docker push ghcr.io/jpch/${{ matrix.arch }}-continente-mcp:latest
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo "- image: $(cat size.txt 2>/dev/null)"
            echo "- memory.peak: $(docker exec smoke cat /sys/fs/cgroup/memory.peak 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY"
