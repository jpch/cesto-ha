name: Continente MCP
version: "0.1.0"
slug: continente_mcp
description: Shared shopping list and Continente.pt basket builder (unofficial MCP). Never checks out or pays.
url: https://github.com/jpch/continente-mcp-ha
image: ghcr.io/jpch/{arch}-continente-mcp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
options:
  test_mode: true
  log_level: info
schema:
  test_mode: bool
  log_level: list(debug|info|warning|error)
